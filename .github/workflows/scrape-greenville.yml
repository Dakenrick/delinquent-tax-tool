name: Scrape Greenville County SC tax sale list

on:
  schedule:
    - cron: "15 12 * * *"  # daily, offset from Dorchester's run to avoid both hitting Actions at once
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Greenville scraper
        run: python scrapers/greenville_sc/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/greenville_sc/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Update Greenville County tax sale data ($(date -u +'%Y-%m-%d'))"
            git push
          fi
